global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ragkit
    metrics_path: /metrics
    # Set RAGKIT_ADMIN_TOKEN on the API and mount the same value here to protect /metrics.
    # authorization:
    #   credentials_file: /etc/prometheus/ragkit_token
    static_configs:
      - targets: ["api:8000"]
