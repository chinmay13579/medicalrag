name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:           # run the generative red-team by hand
  schedule:
    - cron: "0 3 * * 1"        # ...and weekly (Mondays 03:00 UTC)

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e .[dev,ui,otel]
      - run: ruff check src eval tests scripts
      - run: pytest -q        # unit, observability, ops-config and Streamlit AppTest suites
      # Retrieval/privacy/safety quality gate (offline profile, no model downloads, no API key).
      - run: python eval/run_eval.py

  security-promptfoo:
    runs-on: ubuntu-latest
    needs: test-and-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: pip install -e .
      - run: npm ci
      - name: start service
        run: |
          uvicorn --factory ragkit.api.app:get_app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: promptfoo deterministic security suite
        run: npx promptfoo eval -c promptfoo/promptfooconfig.yaml --no-cache --output promptfoo/output/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: promptfoo-results, path: promptfoo/output/ }

  # Generative red-team: needs an LLM key and network, so it never runs on push or PR. It runs weekly or by
  # hand, and skips cleanly (green) when the ANTHROPIC_API_KEY repository secret has not been created.
  redteam:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: check for the API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret is not set, red-team skipped"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with: { node-version: 22, cache: npm }
      - run: pip install -e . && npm ci
        if: steps.key.outputs.present == 'true'
      - run: |
          uvicorn --factory ragkit.api.app:get_app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
        if: steps.key.outputs.present == 'true'
      - run: npx promptfoo redteam run -c promptfoo/redteam.yaml --output promptfoo/output/redteam.json
        if: steps.key.outputs.present == 'true'
